# Base configuration. Every environment-specific value comes from an environment variable.
# The defaults below are for local development only and contain no production credentials.
spring:
  application:
    name: tracelens-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tracelens}
    username: ${DB_USERNAME:tracelens}
    password: ${DB_PASSWORD:tracelens_dev_password}
    hikari:
      connection-timeout: 5000     # fail fast (ms) when the database is unreachable
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

tracelens:
  app:
    name: TraceLens
    version: 0.1.0
  cors:
    allowed-origins: ${TRACELENS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  demo:
    # Off unless a profile or environment variable turns it on. Never enable in production.
    enabled: ${TRACELENS_DEMO_ENABLED:false}
    max-delay-ms: 10000
  llm:
    enabled: ${TRACELENS_LLM_ENABLED:true}
    api-key: ${LLM_API_KEY:${OPENAI_API_KEY:${GEMINI_API_KEY:}}}
    model: ${LLM_MODEL:gpt-4o-mini}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    provider: ${LLM_PROVIDER:openai}
    timeout-ms: ${LLM_TIMEOUT_MS:25000}
  rules:
    error-window-minutes: ${INCIDENT_ERROR_WINDOW_MINUTES:5}
    error-threshold: ${INCIDENT_ERROR_THRESHOLD:5}
    critical-error-threshold: ${INCIDENT_CRITICAL_THRESHOLD:1}
    recurrence-threshold: ${INCIDENT_RECURRENCE_THRESHOLD:3}

logging:
  level:
    root: INFO
    com.tracelens: INFO
  pattern:
    level: "%5p [%X{requestId:-}]"
